# 1. Euclidean Clustering Parameters
cluster_tolerance: 0.15     # 점 사이의 최대 거리 (미터). 이보다 가까우면 같은 그룹으로 인식
min_cluster_size: 10        # 클러스터를 구성하는 최소 점의 개수
max_cluster_size: 500       # 클러스터를 구성하는 최대 점의 개수

# 2. Size Filtering Parameters (Brute-force Distance Check)
max_cluster_extent: 1.2     # 클러스터 내 두 점 사이의 최대 거리 허용치 (미터)
min_cluster_extent: 0.4     # 클러스터 내 두 점 사이의 최소 거리 허용치 (미터)

# 3. Fixed Box Parameters (L-Shape Fitting)
use_fixed_size: true        # true: 고정된 크기 사용, false: 관측된 크기 사용
fixed_width: 0.9            # 고정 박스의 폭 (미터)
fixed_length: 0.45          # 고정 박스의 길이 (미터)