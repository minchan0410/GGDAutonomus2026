planner_common:
  roi:
    # ROI 범위: 차량 좌표계 기준, 단위는 meters
    # min/max는 ROI 박스의 전/후(x) 및 좌/우(y) 경계
    # offset_x는 ROI를 전방으로 이동시키는 보정값
    # 전방 ROI 중심 보정값(미터)
    offset_x: 0.7
    # ROI 반경(미터)
    radius: 1.1
    # ROI 섹터 각도 범위(도): 최소/최대 각도(포함), 0 = 전방
    angle_min_deg: -30.0
    angle_max_deg: 30.0

final_planner:
  # 루프 주기(Hz)
  rate_hz: 20

  # 기본 모터 명령(수동/DEFAULT 모드)
  default_motor: 0

  # 시작 후 일정 시간 동안 상태 변경(차선 변경 트리거) 무시
  state_change_delay_sec: 6.0

  # start state: 0 -> 255 램프 가속 시간(초)
  start_ramp_sec: 1.0

  # 시리얼 OK 신호가 이 시간 안에 들어와야 준비 상태로 인정 (초)
  serial_timeout_sec: 0.5

  # 첫 번째 차선 주행 지속 시간(초)
  lane_driving1_timeout_sec: 7.0
  lane_driving1_timeout_r_sec: 2.0
  case1_timeout_sec: 1.0
  case2_timeout_sec: 2.0

  # 좌 차선 변경 완료 후 지연 시간(초)
  left_lc_complete_delay_sec: 0.3

  # 우 차선 변경 완료 후 지연 시간(초)
  right_lc_complete_delay_sec: 0.25

  # 정지 속도 명령 값
  speed_0: 0
  # 중간 속도 명령 값
  speed_mid: 255
  # 고속 속도 명령 값
  speed_high: 255
  # 차선 변경 시 조향 명령 크기
  lc_steer: 22.5

  # 내부 큐 최대 길이
  queues_maxlen: 5
  # YOLO 충돌 판단 누적 횟수 임계
  yolo_count_threshold: 3
  # 신호등 초록 인식 누적 횟수 임계
  traffic_green_threshold: 3
  # 신호 대기 최대 시간(초)
  traffic_green_timeout: 13.0

  # ---- lane change (run2.py-aligned) ----
  # 차선 좌표 입력 토픽
  lane_lines_topic: "/lane_lines_px"
  # 유효하지 않은 값 표시(그래프용)
  invalid_value: .nan
  # 입력 이미지 너비(px)
  image_width: 640
  # 입력 이미지 높이(px)
  image_height: 480
  # run2.py 기준 ROI 높이 비율
  roi_height: 0.45
  # 라인 미검출 시 ROI 경계로 클램핑 여부
  clamp_to_roi: true

  # 윈도우 크기 (샘플 개수)
  lc_window_size: 5
  # 윈도우 내 최소 이동거리 (픽셀)
  lc_dist_threshold: 200.0
  # ddx 임계값 (절대값)
  lc_ddx_threshold: 30000.0
