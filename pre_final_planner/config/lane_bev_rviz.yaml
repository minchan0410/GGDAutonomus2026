# topics
# 라인/타깃/조향/그리드 시각화 토픽 이름
lines_topic: /lane_lines_px
target_topic: /lane_target_px
lane_steer_topic: /lane_steer
grid_topic: /lane_bev/grid
marker_topic: /lane_bev/markers

# frame
# 좌표 기준 프레임
frame_id: base_link

# camera intrinsics
# 카메라 내부 파라미터: fx, fy(초점거리), cx, cy(주점), 단위는 픽셀
fx: 928.4324
fy: 928.4279
cx: 638.6842
cy: 359.8989

# camera extrinsics
# base_link 기준 카메라 위치/자세 (m/deg)
cam_x_m: 0.0
cam_y_m: 0.0
cam_height_m: 1.20
cam_roll_deg: 0.0
cam_pitch_deg: 10.0
cam_yaw_deg: 0.0

# occupancy grid
# BEV 그리드 해상도/크기 및 원점 (meters)
resolution: 0.05
grid_w: 400
grid_h: 400
origin_x: 0.0
origin_y: -10.0

# drawing
# 표시 품질/범위/주기 설정
sample_n: 30
target_radius_cells: 2
line_thickness_cells: 0
max_range_x: 20.0
publish_rate: 20.0

# marker style
# 타깃 원/조향 텍스트 마커 스타일 설정 (RGBA, meters)
target_color_rgba: [1.0, 0.3, 0.0, 1.0]
steer_text_color_rgba: [1.0, 1.0, 1.0, 1.0]
steer_text_size: 0.3
steer_text_z: 0.4
