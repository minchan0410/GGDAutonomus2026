# topics
# 라인/타깃/조향/그리드 시각화 토픽 이름
lines_topic: /lane_lines_px
target_topic: /lane_target_px
lane_steer_topic: /lane_steer
grid_topic: /lane_bev/grid
marker_topic: /lane_bev/markers

# frame
# 좌표 기준 프레임
frame_id: base_link


#해상도 1280*720 일때 내적 파라미터

# fx: 832.4660
# fy: 844.8521
# cx: 688.4296
# cy: 316.8229


#해상도 640*480 일때 내적 파라미터
fx: 505.0742
fy: 531.2114
cx: 352.6202
cy: 135.9729


# camera extrinsics
# base_link 기준 카메라 위치/자세 (m/deg)
cam_x_m: 0.0
cam_y_m: 0.0
cam_height_m: 0.75
cam_roll_deg: 0.0
cam_pitch_deg: 14.5
cam_yaw_deg: 0.0

# occupancy grid
# BEV 그리드 해상도/크기 및 원점 (meters)
resolution: 0.05
grid_w: 400
grid_h: 400
origin_x: 0.0
origin_y: -10.0

# drawing
# 표시 품질/범위/주기 설정
sample_n: 30
target_radius_cells: 2
line_thickness_cells: 0
max_range_x: 20.0
publish_rate: 20.0

# marker style
# 타깃 원/조향 텍스트 마커 스타일 설정 (RGBA, meters)
target_color_rgba: [1.0, 0.3, 0.0, 1.0]
steer_text_color_rgba: [1.0, 1.0, 1.0, 1.0]
steer_text_size: 0.3
steer_text_z: 0.4
